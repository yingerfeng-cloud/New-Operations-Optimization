name: production-quality

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'
  OPTIFORGE_SYNC_JOBS: 'true'
  LLM_ENABLED: 'false'

jobs:
  frontend-quality:
    name: Frontend Typecheck Build Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Frontend unit suite
        run: npm run test:unit
        working-directory: frontend

  backend-contract:
    name: Backend Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Complete default contract regression (includes iteration contracts)
        run: python -m pytest -q
      - name: Audit fixed component formulas
        run: python scripts/audit_component_formulas.py --output reports/component_formula_audit.json
      - name: Upload component formula audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-formula-audit-${{ github.run_id }}
          path: reports/component_formula_audit.json
          if-no-files-found: error
          retention-days: 14

  mock-e2e:
    name: Mock E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e:mock
        working-directory: frontend
      - name: Upload Mock E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock-e2e-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            frontend/playwright-report/
            frontend/test-results/frontend-mock/

  iteration-live:
    name: Iteration API Solver Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start isolated real stack
        env:
          OPTIFORGE_RUNTIME_STORE: ${{ runner.temp }}/iteration/runtime.json
          OPTIFORGE_AGENT_SKILLS_DIR: ${{ runner.temp }}/iteration/skills
          OPTIFORGE_STACK_LOG_DIR: ${{ runner.temp }}/iteration/logs
          OPTIFORGE_SYNC_JOBS: 'false'
        run: |
          mkdir -p "${{ runner.temp }}/iteration"
          cp -R agent_skills "${{ runner.temp }}/iteration/skills"
          bash start.sh --api-port 18033 --frontend-port 5181 --no-browser
      - name: Real API and HiGHS browser acceptance
        env:
          OPTIFORGE_REVIEW_URL: http://127.0.0.1:5181
          PW_CHANNEL: chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test -c playwright.cloud-review.config.ts cloud_review_iteration.spec.ts | tee ../reports/iteration-live-browser.log
        working-directory: frontend
      - name: Stop isolated stack
        if: always()
        run: bash stop.sh --api-port 18033 --frontend-port 5181
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iteration-live-${{ github.run_id }}
          path: |
            reports/iteration-live-browser.log
            ${{ runner.temp }}/iteration/logs/
          if-no-files-found: ignore
          retention-days: 14

  delivery-package:
    name: Delivery Package Self Check
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Verify test matrix
        run: python scripts/verify_test_matrix.py
      - name: Verify delivery package contracts
        shell: pwsh
        run: ./scripts/verify_delivery_package.ps1
      - name: Build and inspect delivery package
        shell: pwsh
        run: ./package.ps1 -OutputPath "${{ runner.temp }}/optiforge-platform.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: optiforge-platform-delivery-${{ github.run_id }}
          path: ${{ runner.temp }}/optiforge-platform.zip
          if-no-files-found: error
          retention-days: 14
